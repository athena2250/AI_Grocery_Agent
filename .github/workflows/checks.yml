name: App checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: mobile
      - run: node scripts/build-reporting.cjs --check
      - run: npm run typecheck && npm run lint && npm test -- --runInBand && npm run build:web
        working-directory: mobile
      - run: python -m pip install -e './backend[dev]' -e './admin[dev]'
      - run: python -m pytest -m 'not llm' -q
        working-directory: backend
      - run: python -m pytest -q
        working-directory: admin
      - run: docker build -t hearth-api ./backend
