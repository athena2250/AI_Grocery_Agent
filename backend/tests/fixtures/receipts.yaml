# Receipt fixtures for plan_09 (backend/tests/test_receipts.py).
#
# Each case: the OCR text of one receipt, what the LLM returned for it (fed in
# via a fake client), and the expected parse after the deterministic rules.
# Some `llm_output`s contain deliberate model mistakes (an invented price, an
# invented line, an invented qty) — the expected parse shows them caught.
#
# These are synthetic transcriptions shaped like real Indian till receipts.
# Replace / extend with real receipt OCR as photos become available.

- name: dmart_with_tax_and_discount
  ocr_text: |
    D-MART
    Avenue Supermarts Ltd, Kukatpally
    Bill No 4471    Dt 21/09/2026 18:42
    ITEM                QTY    AMT
    TOOR DAL 1KG         1   145.00
    TOMATO            1.000 KG  40.00
    PARLE-G 250G         2    50.00
    AASHIR ATTA 5KG      1   265.00
    CGST 2.5%                 6.25
    SGST 2.5%                 6.25
    DISCOUNT                -10.00
    ROUND OFF                -0.50
    TOTAL                   502.00
  llm_output:
    readable: true
    lines:
      - {raw_line: "TOOR DAL 1KG         1   145.00", product_guess: toor dal, qty: 1, unit: pcs, package_size: 1 kg, price: 145.0, confidence: high}
      - {raw_line: "TOMATO            1.000 KG  40.00", product_guess: tomatoes, qty: 1, unit: kg, price: 40.0, confidence: high}
      - {raw_line: "PARLE-G 250G         2    50.00", product_guess: biscuits, brand: Parle-G, qty: 2, unit: pack, package_size: 250 g, price: 50.0, confidence: high}
      - {raw_line: "AASHIR ATTA 5KG      1   265.00", product_guess: wheat atta, brand: Aashirvaad, qty: 1, unit: pcs, package_size: 5 kg, price: 265.0, confidence: medium}
      - {raw_line: "CGST 2.5%                 6.25", product_guess: null, price: 6.25, confidence: high}
      - {raw_line: "SGST 2.5%                 6.25", product_guess: null, price: 6.25, confidence: high}
      - {raw_line: "DISCOUNT                -10.00", product_guess: null, confidence: high}
      # Model mislabels round-off as an item — the non-item rule still skips it.
      - {raw_line: "ROUND OFF                -0.50", product_guess: round off, confidence: low}
      - {raw_line: "TOTAL                   502.00", product_guess: null, price: 502.0, confidence: high}
  expected:
    store: DMart
    purchased_at: 2026-09-21
    lines:
      - {product_id: p_toor_dal, qty: 1, unit: pcs, price: 145.0, brand: null, status: ready}
      - {product_id: p_tomato, qty: 1, unit: kg, price: 40.0, brand: null, status: ready}
      - {product_id: p_biscuits, qty: 2, unit: pack, price: 50.0, brand: Parle-G, status: ready}
      - {product_id: p_wheat_atta, qty: 1, unit: pcs, price: 265.0, brand: Aashirvaad, status: ready}

