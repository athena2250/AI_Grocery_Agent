- name: greenbazaar_coriander_ambiguity
  ocr_text: |
    GREEN BAZAAR ORGANICS
    Jubilee Hills, Hyderabad
    25/09/2026
    CORIANDER 100G     1    22.00
    CORR PWD 100G      1    30.00
    HALDI 200G         1    48.00
    GST INCL                 4.80
    TOTAL                  100.00
  llm_output:
    readable: true
    lines:
      # "CORIANDER" alone is leaves / seeds / powder — must be asked.
      - {raw_line: "CORIANDER 100G     1    22.00", product_guess: coriander, qty: 1, unit: pcs, package_size: 100 g, price: 22.0, confidence: medium}
      - {raw_line: "CORR PWD 100G      1    30.00", product_guess: coriander powder, qty: 1, unit: pcs, package_size: 100 g, price: 30.0, confidence: medium}
      - {raw_line: "HALDI 200G         1    48.00", product_guess: turmeric powder, qty: 1, unit: pcs, package_size: 200 g, price: 48.0, confidence: high}
      - {raw_line: "GST INCL                 4.80", product_guess: null, confidence: high}
      - {raw_line: "TOTAL                  100.00", product_guess: null, confidence: high}
  expected:
    store: GreenBazaar
    purchased_at: 2026-09-25
    lines:
      - {product_id: null, qty: 1, unit: pcs, price: 22.0, status: needs_review, review_kind: product_type}
      - {product_id: p_coriander_powder, qty: 1, unit: pcs, price: 30.0, status: ready}
      - {product_id: p_turmeric, qty: 1, unit: pcs, price: 48.0, status: ready}

- name: unknown_kirana_store
  ocr_text: |
    SRI LAKSHMI KIRANA STORES
    Ph 98480 12345
    RICE SONA MASOORI 10KG   1   620.00
    SUNFLWR OIL 1L           2   290.00
    XYZ SPL MIX              1    45.00
    NET AMOUNT               955.00
  llm_output:
    readable: true
    lines:
      - {raw_line: "RICE SONA MASOORI 10KG   1   620.00", product_guess: rice, qty: 1, unit: pcs, package_size: 10 kg, price: 620.0, confidence: high}
      - {raw_line: "SUNFLWR OIL 1L           2   290.00", product_guess: sunflower oil, qty: 2, unit: pcs, package_size: 1 L, price: 290.0, confidence: medium}
      # Unknown to the catalog → "What is ...?"
      - {raw_line: "XYZ SPL MIX              1    45.00", product_guess: namkeen mixture, qty: 1, unit: pcs, price: 45.0, confidence: low}
      # Hallucinated — not on the receipt at all → dropped.
      - {raw_line: "SUGAR 1KG                1    44.00", product_guess: sugar, qty: 1, unit: kg, price: 44.0, confidence: high}
      - {raw_line: "NET AMOUNT               955.00", product_guess: null, confidence: high}
  expected:
    store: null
    purchased_at: null
    lines:
      - {product_id: p_rice, qty: 1, unit: pcs, price: 620.0, status: ready}
      - {product_id: p_sunflower_oil, qty: 2, unit: pcs, price: 290.0, status: ready}
      - {product_id: null, qty: 1, unit: pcs, price: 45.0, status: needs_review, review_kind: product_identity}

- name: more_invented_qty_and_low_confidence
  ocr_text: |
    more.
    More Retail Pvt Ltd - Madhapur
    Inv Dt: 2026-09-26
    NANDINI CURD 400G          72.00
    T.B. DUST 250G      1     140.00
    TATA SALT 1KG       1      28.00
    YOU SAVED                  12.00
    TOTAL                     240.00
  llm_output:
    readable: true
    lines:
      # qty 2 is not printed → cleared → "How much curd did you buy?"
      - {raw_line: "NANDINI CURD 400G          72.00", product_guess: curd, brand: Nandini, qty: 2, unit: pack, package_size: 400 g, price: 72.0, confidence: high}
      # Model unsure → "Is ... tea?"
      - {raw_line: "T.B. DUST 250G      1     140.00", product_guess: tea, qty: 1, unit: pcs, package_size: 250 g, price: 140.0, confidence: low}
      - {raw_line: "TATA SALT 1KG       1      28.00", product_guess: salt, brand: Tata, qty: 1, unit: pcs, package_size: 1 kg, price: 28.0, confidence: high}
      - {raw_line: "YOU SAVED                  12.00", product_guess: null, confidence: high}
      - {raw_line: "TOTAL                     240.00", product_guess: null, confidence: high}
  expected:
    store: More
    purchased_at: 2026-09-26
    lines:
      - {product_id: p_curd, qty: null, unit: null, price: 72.0, brand: Nandini, status: needs_review, review_kind: quantity}
      - {product_id: p_tea, qty: 1, unit: pcs, price: 140.0, status: needs_review, review_kind: product_identity}
      - {product_id: p_salt, qty: 1, unit: pcs, price: 28.0, brand: Tata, status: ready}
