[project]
name = "ai-grocery-agent-backend"
version = "0.1.0"
description = "AI Grocery Agent backend (Phase 2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
markers = [
    "llm: tests that hit a real local Ollama instance",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
