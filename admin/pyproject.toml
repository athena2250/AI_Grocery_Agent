[project]
name = "hearth-admin"
version = "0.1.0"
description = "Hearth admin console — a separate service over the household database"
requires-python = ">=3.11"
dependencies = [
    # The schema lives in the backend's SQLModel classes; the admin reads them, never copies them.
    "ai-grocery-agent-backend",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["hearth_admin"]

[tool.setuptools.package-data]
hearth_admin = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["app", "hearth_admin"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
