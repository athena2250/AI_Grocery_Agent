# Hearth: hosted API + browser app + PostgreSQL. Admin stays on the operator's Mac.
# No manual secrets are required: Render generates AUTH_SECRET and wires DATABASE_URL.
services:
  - name: hearth-api
    type: web
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hearth-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          name: hearth-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PRIVACY_CONTACT_EMAIL
        value: rithvika.tiruveedhula51@gmail.com
      - key: AUTH_SECRET
        generateValue: true
      # Add OLLAMA_HOST/API_KEY/MODEL later if desired; rule-based understanding works now.

  - name: hearth-web
    type: web
    runtime: static
    buildCommand: npm --prefix mobile ci && node scripts/build-web-production.cjs
    staticPublishPath: ./mobile/dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: hearth-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: hearth-db
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 1
